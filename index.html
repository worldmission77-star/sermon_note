<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="설교노트">
<meta name="theme-color" content="#33396b">
<link rel="manifest" href="manifest.json">
<title>설교노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="bible-data.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --print-font-size:9pt;
  --bg-main:#f2f3f9;
  --ink:#262c4a;
  --muted:#7b81a3;
  --dim:#aab0c8;
  --accent:#3c4374;
  --accent-dark:#282d54;
  --accent-light:#e8e9f6;
  --accent-soft:#d3d6ee;
  --gold:#bd9640;
  --gold-dark:#96742c;
  --gold-light:#faf4e2;
  --gold-soft:#f0e1b4;
  --card-bg:rgba(255,255,255,0.86);
  --border:#e2e3f0;
  --danger:#c15a5a;
  --radius:14px;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'NanumSquare','Nanum Gothic',sans-serif;
  background:var(--bg-main);color:var(--ink);
  display:flex;flex-direction:column;position:relative;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 12% -10%, rgba(189,150,64,0.16), transparent 45%),
    radial-gradient(circle at 100% 10%, rgba(60,67,116,0.14), transparent 40%),
    linear-gradient(165deg,#eef0f8,#f7f4ea 65%,#f2eee0);
}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent-soft);border-radius:4px}

/* ── TOP BAR ── */
.topbar{background:linear-gradient(100deg,var(--accent-dark),var(--accent));flex-shrink:0;box-shadow:0 2px 14px rgba(40,45,84,0.25);position:relative;z-index:5}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px}
.app-title{display:flex;align-items:center;gap:8px;font-family:'NanumSquare','Nanum Gothic',sans-serif;font-size:20px;font-weight:800;letter-spacing:2px;color:#fdf9ec}
.app-title .ribbon{display:inline-block;width:6px;height:20px;background:linear-gradient(180deg,var(--gold),var(--gold-dark));border-radius:2px;box-shadow:0 1px 4px rgba(0,0,0,0.25)}
.topbar-sub{font-size:10.5px;color:rgba(253,249,236,0.65);letter-spacing:0.5px}

/* ── APP BODY ── */
#app-body{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hidden{display:none !important}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;padding:10px 14px;flex-shrink:0;background:rgba(255,255,255,0.55);border-bottom:1px solid var(--border)}
.filter-bar input, .filter-bar select{
  font-family:'NanumSquare','Nanum Gothic',sans-serif;font-size:13px;border:1px solid var(--border);
  border-radius:10px;padding:8px 10px;background:#fff;color:var(--ink);
}
.filter-bar input{flex:1;min-width:0}
.filter-bar select{flex-shrink:0;max-width:110px}
.backup-btn{flex-shrink:0;width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:#fff;color:var(--accent);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.backup-btn:hover{background:var(--accent-light)}
#select-mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.select-action-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;background:#fff;border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(40,45,84,0.12);
}
.select-action-bar span{font-size:13px;font-weight:700;color:var(--accent-dark)}
.sermon-card.select-mode{padding-left:44px}
.sermon-checkbox{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;
  border:2px solid var(--accent-soft);background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;
}
.sermon-checkbox.checked{background:var(--accent);border-color:var(--accent)}

/* ── LIST ── */
.scroll-area{flex:1;overflow-y:auto;padding:12px 14px 90px}
.empty-state{text-align:center;padding:60px 20px;color:var(--dim);font-size:13px;line-height:1.8}
.sermon-card{
  position:relative;margin-bottom:10px;padding:14px 16px 14px 20px;border-radius:var(--radius);
  background:var(--card-bg);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--border);box-shadow:0 2px 10px rgba(40,45,84,0.06);cursor:pointer;transition:box-shadow .2s,transform .2s;
}
.sermon-card:hover{box-shadow:0 4px 18px rgba(40,45,84,0.12);transform:translateY(-1px)}
.sermon-card::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;width:4px;
  background:linear-gradient(180deg,var(--gold),var(--gold-dark));border-radius:0 3px 3px 0;
}
.sermon-card .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.sermon-date{font-size:11px;color:var(--gold-dark);font-weight:700;letter-spacing:0.5px}
.sermon-series{font-size:10px;color:var(--muted);background:var(--accent-light);padding:2px 8px;border-radius:10px}
.sermon-title{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:3px;line-height:1.35}
.title-ref{font-weight:700;color:var(--gold-dark);font-size:0.85em}
.sermon-meta{font-size:12px;color:var(--muted)}

/* ── FAB ── */
.fab{
  position:fixed;right:20px;bottom:24px;width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fdf9ec;border:none;
  font-size:26px;box-shadow:0 6px 18px rgba(40,45,84,0.35);cursor:pointer;z-index:10;
  display:flex;align-items:center;justify-content:center;
}
.fab:hover{transform:scale(1.05)}

/* ── DETAIL VIEW ── */
#view-detail{flex:1;display:flex;flex-direction:column;overflow:hidden}
.detail-topbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,0.6);flex-shrink:0}
.back-btn{background:none;border:1px solid var(--border);border-radius:16px;padding:5px 12px;font-size:12px;color:var(--accent);cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.back-btn:hover{background:var(--accent-light)}
.detail-topbar .spacer{flex:1}
.admin-edit-btn{background:none;border:1px solid var(--gold-soft);color:var(--gold-dark);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.admin-edit-btn:hover{background:var(--gold-light)}
.export-btn{background:none;border:1px solid var(--accent-soft);color:var(--accent);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.export-btn:hover{background:var(--accent-light)}

.detail-scroll{flex:1;overflow-y:auto;padding:16px 16px 90px}
.sermon-header{margin-bottom:14px}
.sermon-header .d-date{font-size:12px;color:var(--gold-dark);font-weight:700}
.sermon-header .d-title{font-family:'NanumSquare','Nanum Gothic',sans-serif;font-size:21px;font-weight:800;color:var(--ink);margin:4px 0 6px;line-height:1.4}
.sermon-header .d-meta{font-size:13px;color:var(--muted)}

.scripture-box{
  margin-bottom:16px;border-radius:var(--radius);overflow:hidden;background:var(--gold-light);
  border:1px solid var(--gold-soft);padding:14px 16px;
}
.scripture-ref{font-size:12.5px;font-weight:800;color:var(--gold-dark);margin-bottom:8px;letter-spacing:0.5px}
.verse-line{display:flex;gap:6px;font-size:14px;line-height:1.75;color:#3a2f10;margin-bottom:2px}
.verse-num{flex-shrink:0;font-size:11px;font-weight:800;color:var(--gold-dark);margin-top:3px}
.verse-body{flex:1}

.note-section{border-radius:var(--radius);background:var(--card-bg);border:1px solid var(--border);padding:14px 16px;box-shadow:0 2px 10px rgba(40,45,84,0.06)}
.note-section .note-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.note-section .note-label span{font-size:13px;font-weight:800;color:var(--accent-dark)}
#note-save-status{font-size:10.5px;color:var(--dim)}
#note-editor{
  width:100%;min-height:180px;border:none;outline:none;resize:none;overflow-y:hidden;
  font-family:'NanumSquare','Nanum Gothic',sans-serif;font-size:14.5px;line-height:1.8;color:var(--ink);
  background:transparent;
}
#note-editor::placeholder{color:var(--dim)}
#note-editor-print{display:none}
#sermon-header-print{display:none}
#batch-print-root{display:none}
.note-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.note-bible-toggle{background:none;border:1px solid var(--gold-soft);color:var(--gold-dark);border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.note-bible-toggle:hover{background:var(--gold-light)}
.note-bible-toggle.active{background:var(--gold-light);border-color:var(--gold)}
.note-save-btn{background:var(--accent-light);border:1px solid var(--accent-soft);color:var(--accent-dark);border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif;font-weight:700}
.note-save-btn:hover{background:var(--accent-soft)}
.note-image-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.note-image-btn:hover{background:var(--accent-light);color:var(--accent-dark)}
.note-delete-btn{background:none;border:1px solid rgba(193,90,90,0.4);color:var(--danger);border-radius:14px;padding:4px 11px;font-size:11px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.note-delete-btn:hover{background:rgba(193,90,90,0.1)}

.note-image-gallery{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px}
.note-image-item{position:relative}
.note-image-thumb{
  width:100%;height:auto;display:block;border-radius:12px;cursor:pointer;
  border:3px solid rgba(255,255,255,0.85);
  box-shadow:0 0 0 1px rgba(189,150,64,0.18), 0 0 16px 4px rgba(189,150,64,0.22), 0 4px 12px rgba(40,45,84,0.16);
  transition:transform .15s;
}
.note-image-thumb:hover{transform:scale(1.02)}
.note-image-remove{
  position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;
  background:rgba(38,44,74,0.85);color:#fff;border:2px solid #fff;font-size:11px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;z-index:2;
}
.note-image-resize{
  position:absolute;left:6px;bottom:6px;background:rgba(38,44,74,0.72);color:#fff;border:none;
  border-radius:10px;padding:3px 9px;font-size:10.5px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif;
  z-index:2;
}
.note-image-drag-handle{
  position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;
  cursor:nwse-resize;touch-action:none;z-index:3;
  background:rgba(38,44,74,0.82);border:2px solid #fff;border-radius:8px 2px 8px 2px;
}
.note-image-drag-handle::before{
  content:'';position:absolute;right:5px;bottom:5px;width:10px;height:10px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 2px 0;
}
.note-image-num-badge{
  position:absolute;top:6px;left:6px;background:rgba(255,255,255,0.92);color:#282d54;
  font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;z-index:2;
}
.print-hide-inline{display:inherit}
@media print{ .print-hide-inline{display:none !important} }
#image-lightbox{align-items:center;justify-content:center;background:rgba(20,20,30,0.82)}
#image-lightbox img{max-width:92vw;max-height:88vh;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,0.45)}
#note-bible-search-box{margin-bottom:10px}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(30,32,55,0.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-overlay.open{display:flex}
.modal{
  background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:88vh;
  overflow-y:auto;box-shadow:0 -8px 30px rgba(0,0,0,0.25);
}
@media (min-height:700px){
  .modal-overlay{align-items:center}
  .modal{border-radius:20px;max-height:80vh}
}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:2}
.modal-title{font-size:15px;font-weight:800;color:var(--accent-dark)}
.modal-close{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px}
.modal-body{padding:16px 18px 24px}

.field-label{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.field-label:first-child{margin-top:0}
.form-input, .form-select, .form-textarea{
  width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  font-family:'NanumSquare','Nanum Gothic',sans-serif;font-size:14px;color:var(--ink);background:#fbfbfd;
}
.form-textarea{min-height:70px;resize:vertical}
.form-row{display:flex;gap:8px}
.form-row > *{flex:1}

.bible-search-box{margin-top:8px;border:1px solid var(--gold-soft);background:var(--gold-light);border-radius:10px;padding:10px}
.bible-search-row{display:flex;flex-wrap:wrap;gap:6px}
.bible-search-row input{flex:1 1 100%;min-width:0;border:1px solid var(--gold-soft);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.bible-search-row select{flex:1 1 auto;min-width:80px}
.bible-search-row button{flex:0 0 auto;background:var(--gold-dark);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.bible-search-hint{font-size:10.5px;color:var(--gold-dark);margin-top:5px;opacity:0.8}
#edit-scripture-text{
  margin-top:8px;min-height:90px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;
  background:#fff;font-size:13.5px;line-height:1.7;
}
.clear-scripture-btn{margin-top:6px;background:none;border:none;font-size:11.5px;color:var(--danger);cursor:pointer;text-decoration:underline}

.modal-btn-row{display:flex;gap:8px;margin-top:20px}
.btn-primary{flex:1;background:var(--accent);color:#fff;border:none;border-radius:24px;padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}
.btn-primary:hover{background:var(--accent-dark)}
.btn-secondary{background:none;border:1px solid var(--border);color:var(--muted);border-radius:24px;padding:12px 18px;font-size:13px;cursor:pointer;font-family:'NanumSquare','Nanum Gothic',sans-serif}

/* ── TOAST ── */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
  background:rgba(38,44,74,0.94);color:#fdf9ec;padding:10px 20px;border-radius:24px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:200;white-space:nowrap;font-family:'NanumSquare','Nanum Gothic',sans-serif;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 인쇄(PDF 저장)용 스타일 ── */
@media print{
  @page{ size: A4 landscape; margin: 3mm 3mm 8mm 3mm; }
  body::before{display:none !important}
  .topbar, .detail-topbar, .fab, #toast, .modal-overlay, #note-bible-search-box, .note-toolbar{display:none !important}
  .note-image-resize, .note-image-remove, .note-image-drag-handle{display:none !important}
  html, body, #app-body, #view-detail, .detail-scroll{
    overflow:visible !important; height:auto !important; display:block !important; background:#fff !important;
  }
  .detail-scroll{padding:22px 26px !important}
  .sermon-card, .note-section, .scripture-box{box-shadow:none !important; backdrop-filter:none !important}
  .scripture-box{display:none !important} /* 노트 흐름 맨 앞에 다시 넣어서 대신 보여줘요(왼쪽 단에 위치) */
  .sermon-header{display:none !important}
  #sermon-header-print{
    display:block !important; background:#efe7fb; border-radius:12px; padding:14px 18px; margin-bottom:16px;
    font-family:'NanumSquare','Nanum Gothic',sans-serif;
  }
  .note-section{border:none !important; break-inside:auto !important; page-break-inside:auto !important; padding:4px 2px !important; background:transparent !important}
  #note-editor{display:none !important}
  #note-editor-print{display:block !important}
  .print-scale{
    white-space:pre-wrap; word-break:break-word;
    font-family:'NanumSquare','Nanum Gothic',sans-serif; font-size:var(--print-font-size); line-height:1.5; color:#000;
    break-inside:auto !important; page-break-inside:auto !important;
  }
  .print-scale .verse-line, .print-scale .verse-num, .print-scale .scripture-ref{
    font-size:var(--print-font-size) !important; line-height:1.5 !important;
  }
  .print-scale.two-col{
    column-count:2; column-gap:30px; column-rule:1px solid #e5ddc5; column-fill:auto;
    break-inside:auto !important; page-break-inside:auto !important;
  }
  .note-image-item{max-width:100% !important; break-inside:avoid !important; page-break-inside:avoid !important}
  .note-image-thumb{box-shadow:none !important; border:1px solid #ddd !important}
  body.batch-print-mode .filter-bar, body.batch-print-mode .scroll-area,
  body.batch-print-mode .select-action-bar, body.batch-print-mode #fab-add-sermon{
    display:none !important;
  }
  /* 이전에 열어봤던 설교 상세화면(#view-detail)이 남아있다가 강제로 다시 보이는 규칙(위쪽 #view-detail
     규칙)보다 우선하도록, 배치 인쇄 중에는 확실히 숨겨요. */
  body.batch-print-mode #view-detail{ display:none !important; }
  body.batch-print-mode #batch-print-root{ display:block !important; }
}
</style>

</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="app-title"><span class="ribbon"></span>설교노트</div>
    <div class="topbar-sub">📱 이 기기에만 저장</div>
  </div>
</div>

<div id="app-body">

  <div id="view-list">
    <div class="filter-bar">
      <input type="text" id="filter-text" placeholder="설교자·제목 검색" oninput="renderSermonList()">
      <select id="filter-series" onchange="renderSermonList()">
        <option value="">전체 구분</option>
      </select>
      <button class="backup-btn" id="select-mode-btn" onclick="toggleSelectMode()" title="여러 개 선택해서 PDF로 합치기">☑</button>
      <button class="backup-btn" onclick="exportData()" title="백업 내보내기">⬇</button>
      <button class="backup-btn" onclick="document.getElementById('import-file-input').click()" title="백업 가져오기">⬆</button>
      <input type="file" id="import-file-input" accept="application/json" class="hidden" onchange="handleImportFile(event)">
    </div>
    <div class="scroll-area" id="sermon-list"></div>
    <div class="select-action-bar hidden" id="select-action-bar">
      <span id="select-count-label">0개 선택됨</span>
      <div style="display:flex;gap:8px">
        <button class="btn-secondary" onclick="cancelSelectMode()">취소</button>
        <button class="btn-primary" onclick="mergeSelectedToPDF()">📎 PDF로 합치기</button>
      </div>
    </div>
  </div>

  <div id="view-detail" class="hidden">
    <div class="detail-topbar">
      <button class="back-btn" onclick="closeDetail()">← 목록</button>
      <div class="spacer"></div>
      <button class="export-btn" onclick="exportNoteAsPDF()">🖨️ PDF</button>
      <button class="export-btn" onclick="exportNoteAsImage()">🖼️ 이미지</button>
      <button class="admin-edit-btn" id="detail-edit-btn" onclick="openSermonEditModal(currentSermonId)">✎ 설교정보 수정</button>
    </div>
    <div class="detail-scroll">
      <div class="sermon-header">
        <div class="d-date" id="detail-date"></div>
        <div class="d-title" id="detail-title"></div>

<script>
// ══════════════════════════════════════════
// 완전 로컬(개인용) 버전 — 서버/로그인 없이 이 브라우저에만 저장됩니다.
// 데이터는 localStorage에 저장되므로, 브라우저 저장공간을 지우면 함께 사라져요.
// ══════════════════════════════════════════
const STORAGE_KEY = 'sermonNotes_v1';

let sermons = [];        // {id, date, title, preacher, series, scriptureRef, scriptureHtml, note, createdAt, updatedAt}
let currentSermonId = null;
let selectMode = false;
let selectedIds = new Set();
let noteSaveTimer = null;
let editingSermonId = null; // null이면 신규 등록

// ── 저장소 ──
function loadSermonsFromStorage(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    sermons = raw ? JSON.parse(raw) : [];
  }catch(e){
    console.error(e);
    sermons = [];
  }
}
function saveSermonsToStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(sermons));
}

// ── 백업 내보내기 / 가져오기 ──
function exportData(){
  try{
    if(!sermons.length){ showToast('내보낼 데이터가 없어요'); return; }
    const dataStr = JSON.stringify({ exportedAt: new Date().toISOString(), sermons }, null, 2);
    const blob = new Blob([dataStr], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateTag = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `설교노트-백업-${dateTag}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('✓ 백업 파일을 내보냈어요');
  }catch(e){
    console.error(e);
    showToast('⚠️ 내보내기에 실패했어요');
  }
}

function handleImportFile(event){
  const file = event.target.files && event.target.files[0];
  event.target.value = '';
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const imported = Array.isArray(parsed) ? parsed : parsed.sermons;
      if(!Array.isArray(imported)) throw new Error('형식이 올바르지 않아요');
      if(!confirm(`백업 파일에서 설교 ${imported.length}개를 가져올까요?\n(기존 목록에 추가돼요)`)) return;
      const existingIds = new Set(sermons.map(s=>s.id));
      imported.forEach(s=>{
        if(!s.id || existingIds.has(s.id)) s.id = genId();
        existingIds.add(s.id);
        sermons.push(s);
      });
      saveSermonsToStorage();
      updateSeriesFilterOptions();
      renderSermonList();
      showToast(`✓ ${imported.length}개를 가져왔어요`);
    }catch(err){
      console.error(err);
      showToast('⚠️ 백업 파일을 읽을 수 없어요');
    }
  };
  reader.readAsText(file);
}

// ── 유틸 ──
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function openModal(id){document.getElementById(id).classList.add('open');}
function closeModalDirect(id){document.getElementById(id).classList.remove('open');}
function closeModal(id,event){ if(event.target.id===id) closeModalDirect(id); }
function escapeHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDateDisplay(dateStr){
  if(!dateStr) return '';
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return dateStr;
  const days=['주일','월','화','수','목','금','토'];
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} (${days[d.getDay()]})`;
}
function genId(){ return 'sm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

// ── 초기 로드 ──
document.addEventListener('DOMContentLoaded', ()=>{
  loadSermonsFromStorage();
  updateSeriesFilterOptions();
  renderSermonList();
});

function updateSeriesFilterOptions(){
  const sel = document.getElementById('filter-series');
  const current = sel.value;
  const seriesSet = [...new Set(sermons.map(s=>s.series).filter(Boolean))];
  sel.innerHTML = '<option value="">전체 구분</option>' +
    seriesSet.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  sel.value = seriesSet.includes(current) ? current : '';
}

function renderSermonList(){
  const listEl = document.getElementById('sermon-list');
  const q = document.getElementById('filter-text').value.trim().toLowerCase();
  const seriesFilter = document.getElementById('filter-series').value;
  let filtered = [...sermons].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  if(seriesFilter) filtered = filtered.filter(s=>s.series === seriesFilter);
  if(q) filtered = filtered.filter(s=>
    (s.title||'').toLowerCase().includes(q) || (s.preacher||'').toLowerCase().includes(q)
  );
  if(!filtered.length){
    listEl.innerHTML = `<div class="empty-state">${sermons.length? '검색 결과가 없어요' : '오른쪽 아래 + 버튼으로<br>첫 설교노트를 남겨보세요'}</div>`;
    return;
  }
  listEl.innerHTML = filtered.map(s=>`
    <div class="sermon-card${selectMode ? ' select-mode' : ''}" onclick="${selectMode ? `toggleSermonSelected('${s.id}')` : `openDetail('${s.id}')`}">
      ${selectMode ? `<div class="sermon-checkbox${selectedIds.has(s.id) ? ' checked' : ''}">${selectedIds.has(s.id) ? '✓' : ''}</div>` : ''}
      <div class="row1">
        <span class="sermon-date">${formatDateDisplay(s.date)}</span>
        ${s.series?`<span class="sermon-series">${escapeHtml(s.series)}</span>`:''}
      </div>
      <div class="sermon-title">${escapeHtml(s.title||'(제목 없음)')}${s.scriptureRef ? ` <span class="title-ref">(${escapeHtml(s.scriptureRef)})</span>` : ''}</div>
      <div class="sermon-meta">${escapeHtml(s.preacher||'')}</div>
    </div>
  `).join('');
}

// ── 여러 개 선택해서 PDF로 합치기 ──

function autoGrowTextarea(el){

function insertAtCursor(textarea, text){
  const start = textarea.selectionStart ?? textarea.value.length;
  const end = textarea.selectionEnd ?? textarea.value.length;
  const before = textarea.value.substring(0, start);
  const after = textarea.value.substring(end);
  // 삽입 위치 앞에 이미 글자가 있고 줄바꿈이 아니면 줄바꿈부터 시작
  const needsLeadingBreak = before.length > 0 && !before.endsWith('\n');
  const insertText = (needsLeadingBreak ? '\n' : '') + text;
  textarea.value = before + insertText + after;
  const cursorPos = before.length + insertText.length;
  textarea.selectionStart = textarea.selectionEnd = cursorPos;
  textarea.focus();
  autoGrowTextarea(textarea);
}

function buildVerseBracketText(verseList){
  // verseList: [{book, chapter, verse, text}]
  return verseList.map(v=>{
    const abbr = FULL_TO_ABBR[v.book] || v.book;
    return `[${abbr}${v.chapter}:${v.verse}] "${v.text}"`;
  }).join('\n') + '\n\n';
}

function bibleSearchForNote(){
  const query = document.getElementById('note-bible-query').value.trim();
  if(!query){ showToast('검색어를 입력해주세요'); return; }
  if(!window.BIBLE_DATA){ showToast('성경 데이터 로딩 중... 잠시 후 다시 시도해주세요'); return; }

  const version = document.getElementById('note-bible-version').value;
  const books = window.BIBLE_DATA.books;
  const vData = window.BIBLE_DATA[version];
  const textarea = document.getElementById('note-editor');

  try{
    const parsed = parseBibleRef(query);
    if(parsed){
      const bookIdx = books.indexOf(parsed.book);
      if(bookIdx < 0) throw new Error('책 이름을 찾을 수 없어요');
      const bookNo = String(bookIdx + 1);
      const chap = vData[bookNo] && vData[bookNo][parsed.chapter];
      if(!chap) throw new Error('해당 장을 찾을 수 없어요');
      let verseList = [];
      for(let v = parsed.verseStart; v <= parsed.verseEnd; v++){
        if(chap[String(v)]) verseList.push({book:parsed.book, chapter:parsed.chapter, verse:String(v), text:chap[String(v)]});
      }
      if(!verseList.length) throw new Error('해당 절을 찾을 수 없어요');
      insertAtCursor(textarea, buildVerseBracketText(verseList));
      showToast('✓ 노트에 본문이 삽입됐어요');
    } else {
      const verseList = [];
      outer:
      for(const bookNo in vData){
        const bookName = books[parseInt(bookNo)-1];
        for(const chap in vData[bookNo]){
          for(const v in vData[bookNo][chap]){
            const t = vData[bookNo][chap][v];
            if(t.includes(query)){
              verseList.push({book:bookName, chapter:chap, verse:v, text:t});
              if(verseList.length >= 30) break outer;
            }
          }
        }
      }
      if(!verseList.length) throw new Error('검색 결과가 없어요');
      insertAtCursor(textarea, buildVerseBracketText(verseList));
      showToast(`✓ 검색 결과 ${verseList.length}건이 삽입됐어요`);
    }
    document.getElementById('note-bible-query').value = '';
    scheduleNoteSave();
  }catch(e){
    showToast('⚠️ ' + e.message);
  }
}

// ── 노트 이미지 첨부 ──
function compressImageFile(file){
  return new Promise((resolve, reject)=>{
    // 일부 사진 형식(HEIC 등)이나 손상된 파일은 로드 이벤트 자체가 안 일어날 수 있어서,
    // 타임아웃을 걸어 특정 사진에서 무한 대기하지 않고 다음 사진으로 넘어가게 해요.
    const timeoutId = setTimeout(()=>{
      reject(new Error('이미지 처리 시간이 초과됐어요'));
    }, 12000);

    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        clearTimeout(timeoutId);
        const maxDim = 1000;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=>{
        clearTimeout(timeoutId);
        reject(new Error('지원하지 않는 이미지 형식일 수 있어요'));
      };
      img.src = e.target.result;
    };
    reader.onerror = ()=>{
      clearTimeout(timeoutId);
      reject(new Error('파일을 읽을 수 없어요'));
    };
    reader.readAsDataURL(file);
  });
}

async function handleNoteImageSelect(event){
  const files = Array.from(event.target.files || []);
  event.target.value = ''; // 같은 파일 다시 선택 가능하도록 초기화
  if(!files.length || !currentSermonId) return;
  const s = sermons.find(x=>x.id===currentSermonId);
  if(!s) return;
  if(!s.images) s.images = [];

  const textarea = document.getElementById('note-editor');
  let cursorPos = textarea.selectionStart ?? textarea.value.length;

  let addedCount = 0;
  let failedCount = 0;
  for(const file of files){
    if(file.size > 25 * 1024 * 1024){ // 25MB 초과는 처리하지 않고 건너뜀
      failedCount++;
      continue;
    }
    try{
      const dataUrl = await compressImageFile(file);
      const num = s.images.reduce((max, i)=>Math.max(max, i.num || 0), 0) + 1;
      s.images.push({ id: genId(), dataUrl, num, size: 'md' });
      // 커서 위치에 [사진N] 표시를 남겨서 본문 어디에 넣었는지 알 수 있게 해요
      const marker = `[사진${num}]`;
      const before = textarea.value.slice(0, cursorPos);
      const after = textarea.value.slice(cursorPos);
      textarea.value = before + marker + after;
      cursorPos += marker.length;
      addedCount++;
    }catch(e){
      console.error(e);
      failedCount++;
    }
  }
  if(failedCount){
    showToast(addedCount ? `⚠️ ${failedCount}장은 처리하지 못했어요` : '⚠️ 이미지를 처리하지 못했어요');
  }
  if(!addedCount) return;

  textarea.selectionStart = textarea.selectionEnd = cursorPos;
  autoGrowTextarea(textarea);
  s.note = textarea.value;
  s.updatedAt = Date.now();
  try{
    saveSermonsToStorage();
    if(!failedCount) showToast(addedCount > 1 ? `✓ 사진 ${addedCount}장을 본문에 넣었어요` : '✓ 사진을 본문에 넣었어요');
  }catch(e){
    console.error(e);
    s.images.splice(s.images.length - addedCount, addedCount); // 저장 실패분 롤백
    showToast('⚠️ 저장공간이 부족해요. 기존 사진을 정리한 뒤 다시 시도해주세요');
  }
  document.getElementById('note-save-status').textContent = '✓ 저장됨';
  renderNoteImages(s);
}

const IMAGE_SIZE_PRESETS = { sm:'110px', md:'170px', lg:'260px', full:'100%' };
const IMAGE_SIZE_LABELS  = { sm:'S', md:'M', lg:'L', full:'전체' };
const IMAGE_SIZE_ORDER   = ['sm','md','lg','full'];

function renderNoteImages(s){
  const wrap = document.getElementById('note-image-gallery');
  if(!s || !s.images || !s.images.length){
    wrap.innerHTML = '';
    wrap.classList.add('hidden');
    return;
  }
  wrap.classList.remove('hidden');
  wrap.innerHTML = s.images.map(img=>{
    const size = img.size || 'md';
    let itemStyle, label;
    if(size === 'custom' && img.customWidth){
      itemStyle = `width:${img.customWidth}px;max-width:100%`;
      label = `${img.customWidth}px`;
    } else if(size === 'full'){
      itemStyle = 'flex-basis:100%;max-width:100%';
      label = IMAGE_SIZE_LABELS.full;
    } else {
      itemStyle = `width:${IMAGE_SIZE_PRESETS[size] || IMAGE_SIZE_PRESETS.md};max-width:100%`;
      label = IMAGE_SIZE_LABELS[size] || IMAGE_SIZE_LABELS.md;
    }
    return `
    <div class="note-image-item" data-num="${img.num || ''}" style="${itemStyle}">
      <img class="note-image-thumb" src="${img.dataUrl}" onclick="openImageLightbox('${img.id}')">
      ${img.num ? `<div class="note-image-num-badge">사진${img.num}</div>` : ''}
      <button class="note-image-resize" onclick="event.stopPropagation();cycleImageSize('${img.id}')" title="크기 단계 전환">⤢ ${label}</button>
      <button class="note-image-remove" onclick="event.stopPropagation();removeNoteImage('${img.id}')">✕</button>
      <div class="note-image-drag-handle" data-img-id="${img.id}" title="드래그해서 크기 조절"></div>
    </div>
  `;
  }).join('');
}

function cycleImageSize(imgId){
  const s = sermons.find(x=>x.id===currentSermonId);
  const img = s && s.images && s.images.find(i=>i.id===imgId);
  if(!img) return;
  if((img.size || 'md') === 'custom'){
    img.size = 'sm'; // 직접 드래그로 조절한 뒤엔 처음(S)부터 다시 순환
  } else {
    const curIdx = IMAGE_SIZE_ORDER.indexOf(img.size || 'md');
    img.size = IMAGE_SIZE_ORDER[(curIdx + 1) % IMAGE_SIZE_ORDER.length];
  }
  delete img.customWidth;
  s.updatedAt = Date.now();
  saveSermonsToStorage();
  renderNoteImages(s);
}

// ── 사진 드래그로 크기 조절 ──
function startImageDragResize(e){
  const handle = e.target.closest('.note-image-drag-handle');
  if(!handle) return;
  e.preventDefault();
  const imgId = handle.dataset.imgId;
  const item = handle.closest('.note-image-item');
  const gallery = document.getElementById('note-image-gallery');
  if(!item || !gallery) return;

  handle.setPointerCapture(e.pointerId);
  const startX = e.clientX;
  const startWidth = item.getBoundingClientRect().width;
  const minWidth = 80;
  const maxWidth = gallery.getBoundingClientRect().width;

  function onMove(ev){
    const newWidth = Math.round(Math.max(minWidth, Math.min(maxWidth, startWidth + (ev.clientX - startX))));
    item.style.width = newWidth + 'px';
    item.style.flexBasis = 'auto';
    item.style.maxWidth = '100%';
  }
  function onUp(){
    handle.removeEventListener('pointermove', onMove);
    handle.removeEventListener('pointerup', onUp);
    const finalWidth = Math.round(item.getBoundingClientRect().width);
    const s = sermons.find(x=>x.id===currentSermonId);
    const img = s && s.images && s.images.find(i=>i.id===imgId);
    if(img){
      img.customWidth = finalWidth;
      img.size = 'custom';
      s.updatedAt = Date.now();
      saveSermonsToStorage();
      renderNoteImages(s);
    }
  }
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp, { once:true });
}

document.addEventListener('DOMContentLoaded', ()=>{
  const gallery = document.getElementById('note-image-gallery');
  if(gallery) gallery.addEventListener('pointerdown', startImageDragResize);
});

function removeNoteImage(imgId){
  const s = sermons.find(x=>x.id===currentSermonId);
  if(!s || !s.images) return;
  const img = s.images.find(i=>i.id===imgId);
  if(!confirm('이 사진을 삭제할까요?')) return;
  s.images = s.images.filter(i=>i.id!==imgId);
  s.updatedAt = Date.now();
  // 본문에 남아있는 [사진N] 표시도 함께 지워줘요
  if(img && img.num){
    const textarea = document.getElementById('note-editor');
    const marker = `[사진${img.num}]`;
    if(textarea.value.includes(marker)){
      textarea.value = textarea.value.replace(marker, '');
      s.note = textarea.value;
      autoGrowTextarea(textarea);
    }
  }
  saveSermonsToStorage();
  renderNoteImages(s);
}

function openImageLightbox(imgId){
  const s = sermons.find(x=>x.id===currentSermonId);
  const img = s && s.images && s.images.find(i=>i.id===imgId);
  if(!img) return;
  document.getElementById('lightbox-img').src = img.dataUrl;
  openModal('image-lightbox');
}

// ── PDF / 이미지 내보내기 ──
function imageWidthPxFor(img){
  const size = img.size || 'md';
  return size==='custom' && img.customWidth ? img.customWidth
    : size==='sm' ? 130 : size==='lg' ? 300 : size==='full' ? 580 : 200;
}

function getReferencedImageNums(noteText){
  return new Set([...noteText.matchAll(/\[사진(\d+)\]/g)].map(m=>parseInt(m[1], 10)));
}

// 노트 본문의 [사진N] 표시를 실제 이미지로 바꿔서, 내보낼 때는 본문 안에 그대로 삽입되도록 해요
function buildNoteHtmlWithImages(noteText, images){
  const byNum = {};
  (images || []).forEach(img=>{ if(img.num) byNum[img.num] = img; });

  const paragraphs = noteText.split(/\n{2,}/);

  return paragraphs.map(para=>{
    if(!para.trim()) return '';
    const escaped = escapeHtml(para);
    const withImages = escaped.replace(/\[사진(\d+)\]/g, (match, numStr)=>{
      const img = byNum[parseInt(numStr, 10)];
      if(!img) return match;
      // 사진은 오른쪽에 띄워서 넣어요. clear를 넣지 않기 때문에, 사진 옆 빈 공간에도
      // (같은 문단은 물론 다음 문단들까지) 글이 자연스럽게 채워져요.
      const widthPx = Math.min(imageWidthPxFor(img), 260);
      return `<img src="${img.dataUrl}" style="float:right;width:${widthPx}px;max-width:48%;height:auto;margin:4px 0 10px 14px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(189,150,64,0.2)">`;
    });
    return `<div style="white-space:pre-wrap;margin-bottom:14px">${withImages}</div>`;
  }).join('');
}

function buildScripturePrintBlockHtml(s){
  if(!s.scriptureHtml) return '';
  return `<div style="break-inside:avoid;background:#faf4e2;border:1px solid #f0e1b4;border-radius:12px;padding:14px 16px;margin-bottom:16px">`
    + `<div style="font-size:var(--print-font-size);font-weight:800;color:#96742c;margin-bottom:8px">${escapeHtml(s.scriptureRef||'')}</div>`
    + s.scriptureHtml
    + `</div>`;
}

function buildHeaderPrintHtml(s){
  const dateLine = [formatDateDisplay(s.date), s.series].filter(Boolean).map(escapeHtml).join(' · ');
  const titleAndRef = escapeHtml(s.title || '(제목 없음)') + (s.scriptureRef ? ` (${escapeHtml(s.scriptureRef)})` : '');
  const preacher = s.preacher ? `<span style="font-size:11pt;font-weight:600;color:#5a5a6e;margin-left:10px">${escapeHtml(s.preacher)}</span>` : '';
  return `<div style="font-size:10.5pt;color:#96742c;font-weight:700">${dateLine}</div>`
    + `<div style="font-size:15pt;font-weight:800;color:#262c4a;margin-top:5px;line-height:1.4">${titleAndRef}${preacher}</div>`;
}

function mmToPx(mm){ return mm * (96 / 25.4); }

// 실제로 인쇄하기 전에, 내용이 1페이지(A4 가로)에 들어가는지 미리 화면 밖에서 렌더링해보고
// 안 들어가면 폰트를 조금씩 줄여가며 맞는 크기를 찾아요.
function computeFitFontSizePt(s, noteText, twoCol){
  const marginTopMm = 3, marginBottomMm = 8, marginSideMm = 3;
  const pageWmm = 297, pageHmm = 210; // A4 가로
  const contentWpx = mmToPx(pageWmm - marginSideMm * 2);
  const contentHpx = mmToPx(pageHmm - marginTopMm - marginBottomMm);
  const columnGapPx = 30;
  const columnWidthPx = twoCol ? (contentWpx - columnGapPx) / 2 : contentWpx;

  // 헤더 높이 측정
  const headerProbe = document.createElement('div');
  headerProbe.style.cssText = `position:fixed;left:-9999px;top:0;width:${contentWpx}px;box-sizing:border-box;font-family:'NanumSquare','Nanum Gothic',sans-serif;`;
  headerProbe.innerHTML = `<div style="background:#efe7fb;border-radius:12px;padding:14px 18px;margin-bottom:16px">${buildHeaderPrintHtml(s)}</div>`;
  document.body.appendChild(headerProbe);
  const headerHeightPx = headerProbe.getBoundingClientRect().height;
  document.body.removeChild(headerProbe);

  const availablePx = Math.max(60, contentHpx - headerHeightPx);
  const capacityPx = availablePx * (twoCol ? 2 : 1);

  const bodyHtml = buildScripturePrintBlockHtml(s) + buildNoteHtmlWithImages(noteText, s.images);

  const probe = document.createElement('div');
  probe.style.cssText = `position:fixed;left:-9999px;top:0;width:${columnWidthPx}px;font-family:'NanumSquare','Nanum Gothic',sans-serif;white-space:pre-wrap;word-break:break-word;`;
  document.body.appendChild(probe);

  let fontSize = 9;
  const minFontSize = 6;
  while(fontSize > minFontSize){
    probe.style.fontSize = fontSize + 'pt';
    probe.style.lineHeight = '1.5';
    probe.innerHTML = bodyHtml;
    probe.querySelectorAll('.verse-line, .verse-num, .scripture-ref').forEach(el=>{
      el.style.fontSize = fontSize + 'pt';
      el.style.lineHeight = '1.5';
    });
    if(probe.scrollHeight <= capacityPx) break;
    fontSize -= 0.5;
  }
  document.body.removeChild(probe);
  return fontSize;
}

function exportNoteAsPDF(){
  if(!currentSermonId){ showToast('설교를 먼저 선택해주세요'); return; }
  const s = sermons.find(x=>x.id===currentSermonId);
  if(!s) return;
  const noteText = document.getElementById('note-editor').value;
  const twoCol = noteText.trim().length > 300;

  // 내용이 1페이지에 들어가는지 미리 확인하고, 안 들어가면 폰트를 자동으로 줄여요
  const fitFontSize = computeFitFontSizePt(s, noteText, twoCol);

  // 실제 인쇄 전에, 같은 내용을 화면 안 미리보기로 먼저 보여줘요
  const headerHtml = `<div style="background:#efe7fb;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-family:'NanumSquare','Nanum Gothic',sans-serif">${buildHeaderPrintHtml(s)}</div>`;
  const bodyHtml = buildScripturePrintBlockHtml(s) + buildNoteHtmlWithImages(noteText, s.images);
  document.getElementById('pdf-preview-body').innerHTML =
    headerHtml + `<div class="print-scale${twoCol ? ' two-col' : ''}" style="--print-font-size:${fitFontSize}pt">${bodyHtml}</div>`;

  openModal('pdf-preview-modal');
}

function confirmPrintPDF(){
  if(!currentSermonId) return;
  const s = sermons.find(x=>x.id===currentSermonId);
  if(!s) return;
  // 텍스트영역(textarea)은 인쇄 시 페이지를 넘어 나뉘어 인쇄되지 않아서,
  // 인쇄 전용 영역으로 복사해두면 노트가 페이지 경계에서 자연스럽게 이어져요.
  document.getElementById('sermon-header-print').innerHTML = buildHeaderPrintHtml(s);
  const noteText = document.getElementById('note-editor').value;
  const printDiv = document.getElementById('note-editor-print');
  const twoCol = noteText.trim().length > 300;

  const fitFontSize = computeFitFontSizePt(s, noteText, twoCol);
  document.documentElement.style.setProperty('--print-font-size', fitFontSize + 'pt');

  // 본문 말씀을 노트 흐름의 맨 앞에 넣어서, 2단일 때 왼쪽 단 위쪽에 자리잡도록 해요
  // (별도 전체폭 박스가 아니라 노트와 같은 흐름 안에 있어야 왼쪽에 위치해요)
  printDiv.innerHTML = buildScripturePrintBlockHtml(s) + buildNoteHtmlWithImages(noteText, s.images);
  // 노트가 어느 정도 길 때만 2단으로 — 짧은 노트까지 2단으로 나누면 오히려 어색해요
  printDiv.classList.toggle('two-col', twoCol);

  // 본문에 이미 [사진N]으로 삽입된 사진은 아래쪽 사진 갤러리에 중복으로 나오지 않도록 숨겨요
  const referencedNums = getReferencedImageNums(noteText);
  document.querySelectorAll('#note-image-gallery .note-image-item').forEach(item=>{
    const n = parseInt(item.dataset.num, 10);
    item.classList.toggle('print-hide-inline', referencedNums.has(n));
  });

  closeModalDirect('pdf-preview-modal');
  setTimeout(()=>window.print(), 400);
}

// 인쇄가 끝나면(취소 포함) 갤러리에 임시로 씌워둔 숨김 처리와 폰트 크기를 되돌려요
window.addEventListener('afterprint', ()=>{
  document.querySelectorAll('.print-hide-inline').forEach(el=>el.classList.remove('print-hide-inline'));
  document.documentElement.style.setProperty('--print-font-size', '9pt');
  document.body.classList.remove('batch-print-mode');
  const batchRoot = document.getElementById('batch-print-root');
  if(batchRoot) batchRoot.innerHTML = '';
});

// ── 여러 설교를 하나의 PDF로 합쳐서 내보내기 ──
function buildSermonPrintBlock(s, isFirst){
  const noteText = s.note || '';
  // 합쳐서 인쇄할 때는 설교마다 노트 길이에 따라 1단/2단이 서로 달라지면 보기에 들쭉날쭉하니,
  // 모두 2단으로 통일해요. (짧은 노트는 그냥 오른쪽 단이 비게 될 뿐이에요)
  const twoCol = true;
  const fitFontSize = computeFitFontSizePt(s, noteText, twoCol);
  const headerHtml = `<div style="background:#efe7fb;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-family:'NanumSquare','Nanum Gothic',sans-serif">${buildHeaderPrintHtml(s)}</div>`;
  // 문단 안의 사진(float)이 다음 설교의 강제 페이지 나눔 너머로 새어나가지 않도록,
  // 각 설교 내용의 맨 끝에서 확실히 정리(clear)해줘요.
  const bodyHtml = buildScripturePrintBlockHtml(s) + buildNoteHtmlWithImages(noteText, s.images)
    + '<div style="clear:both;height:0;overflow:hidden"></div>';
  return `<div style="${isFirst ? '' : 'break-before:page;page-break-before:always;'}">
    ${headerHtml}
    <div class="print-scale${twoCol ? ' two-col' : ''}" style="--print-font-size:${fitFontSize}pt">${bodyHtml}</div>
  </div>`;
}

async function mergeSelectedToPDF(){
  if(selectedIds.size === 0){ showToast('합칠 설교를 먼저 선택해주세요'); return; }
  if(document.fonts && document.fonts.ready){
    try{ await document.fonts.ready; }catch(e){}
  }
  const selectedSermons = sermons
    .filter(s=>selectedIds.has(s.id))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const root = document.getElementById('batch-print-root');
  root.innerHTML = selectedSermons.map((s, i)=>buildSermonPrintBlock(s, i === 0)).join('');
  document.body.classList.add('batch-print-mode');

  showToast(`설교 ${selectedSermons.length}개를 한 PDF로 합쳐요 · 인쇄창에서 "PDF로 저장"을 선택해주세요`);
  setTimeout(()=>window.print(), 500);
}

function buildExportContainer(s){
  const container = document.createElement('div');
  container.style.cssText = 'position:fixed;left:-9999px;top:0;width:640px;background:#fdfaf3;padding:30px;font-family:NanumSquare,Nanum Gothic,sans-serif;color:#262c4a;box-sizing:border-box;';

  const scriptureHtml = s.scriptureHtml
    ? `<div style="background:#faf4e2;border:1px solid #f0e1b4;border-radius:12px;padding:16px 18px;margin-bottom:18px">
         <div style="font-size:13px;font-weight:800;color:#96742c;margin-bottom:8px">${escapeHtml(s.scriptureRef||'')}</div>
         ${s.scriptureHtml}
       </div>`
    : '';

  const noteText = s.note || '';
  const referencedNums = getReferencedImageNums(noteText);
  const orphanImages = (s.images || []).filter(img=>!referencedNums.has(img.num));
  const noteHtml = noteText ? buildNoteHtmlWithImages(noteText, s.images) : '(작성한 노트가 없어요)';

  const orphanImagesHtml = orphanImages.length
    ? `<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px">
         ${orphanImages.map(img=>`<img src="${img.dataUrl}" style="width:${imageWidthPxFor(img)}px;height:auto;display:block;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px rgba(189,150,64,0.2)">`).join('')}
       </div>`
    : '';

  container.innerHTML = `
    ${buildHeaderPrintHtml(s)}
    <div style="height:16px"></div>
    ${scriptureHtml}
    <div style="font-size:13px;font-weight:800;color:#282d54;margin-bottom:8px">📝 나의 노트</div>
    <div style="white-space:pre-wrap;font-size:14px;line-height:1.85">${noteHtml}</div>
    ${orphanImagesHtml}
  `;
  document.body.appendChild(container);
  return container;
}

async function exportNoteAsImage(){
  if(!currentSermonId){ showToast('설교를 먼저 선택해주세요'); return; }
  const s = sermons.find(x=>x.id===currentSermonId);
  if(!s) return;
  if(typeof html2canvas === 'undefined'){
    showToast('⚠️ 이미지 기능을 불러오지 못했어요 (인터넷 연결을 확인해주세요)');
    return;
  }
  showToast('이미지 생성 중...');
  const container = buildExportContainer(s);
  try{
    const canvas = await html2canvas(container, { backgroundColor:'#fdfaf3', scale:2 });
    const url = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    const safeTitle = (s.title || '설교노트').replace(/[\\/:*?"<>|]/g,'').slice(0,40);
    a.href = url;
    a.download = `${safeTitle}_${s.date||''}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('✓ 이미지로 저장됐어요');
  }catch(e){
    console.error(e);
    showToast('⚠️ 이미지 생성에 실패했어요');
  }finally{
    document.body.removeChild(container);
  }
}

// ── 설교 등록/수정 ──
function openSermonEditModal(id){
  editingSermonId = id || null;
  const isEdit = !!editingSermonId;
  document.getElementById('sermon-edit-title').textContent = isEdit ? '📖 설교 정보 수정' : '📖 설교 등록';
  document.getElementById('delete-sermon-btn').classList.toggle('hidden', !isEdit);

  if(isEdit){
    const s = sermons.find(x=>x.id===editingSermonId);
    document.getElementById('edit-date').value = s.date || '';
    document.getElementById('edit-preacher').value = s.preacher || '';
    document.getElementById('edit-title').value = s.title || '';
    document.getElementById('edit-series').value = s.series || '';
    document.getElementById('edit-scripture-ref').value = s.scriptureRef || '';
    document.getElementById('edit-scripture-text').innerHTML = s.scriptureHtml || '';
  } else {
    document.getElementById('edit-date').value = new Date().toISOString().slice(0,10);
    document.getElementById('edit-preacher').value = '';
    document.getElementById('edit-title').value = '';
    document.getElementById('edit-series').value = '';
    document.getElementById('edit-scripture-ref').value = '';
    document.getElementById('edit-scripture-text').innerHTML = '';
  }
  document.getElementById('edit-bible-query').value = '';
  openModal('sermon-edit-modal');
}

function saveSermon(){
  const date = document.getElementById('edit-date').value;
  const title = document.getElementById('edit-title').value.trim();
  const preacher = document.getElementById('edit-preacher').value.trim();
  const series = document.getElementById('edit-series').value.trim();
  const scriptureRef = document.getElementById('edit-scripture-ref').value.trim();
  const scriptureHtml = document.getElementById('edit-scripture-text').innerHTML.trim();

  if(!date || !title){ showToast('날짜와 제목은 꼭 입력해주세요'); return; }

  if(editingSermonId){
    const s = sermons.find(x=>x.id===editingSermonId);
    Object.assign(s, {date, title, preacher, series, scriptureRef, scriptureHtml, updatedAt: Date.now()});
    showToast('✓ 수정됐어요');
  } else {
    const newSermon = {
      id: genId(), date, title, preacher, series, scriptureRef, scriptureHtml,
      note: '', createdAt: Date.now(), updatedAt: Date.now()
    };
    sermons.push(newSermon);
    showToast('✓ 등록됐어요');
  }
  saveSermonsToStorage();
  updateSeriesFilterOptions();
  renderSermonList();
  if(currentSermonId){
    const s = sermons.find(x=>x.id===currentSermonId);
    if(s) renderDetailHeader(s);
  }
  closeModalDirect('sermon-edit-modal');
}

function deleteSermon(){
  if(!editingSermonId) return;
  if(!confirm('이 설교와 노트를 삭제할까요? 삭제하면 되돌릴 수 없어요.')) return;
  sermons = sermons.filter(x=>x.id!==editingSermonId);
  saveSermonsToStorage();
  updateSeriesFilterOptions();
  showToast('✓ 삭제됐어요');
  closeModalDirect('sermon-edit-modal');
  closeDetail();
  renderSermonList();
}

// ── 성경 검색 (QT앱과 동일한 검색 로직 재사용) ──
const BOOK_ABBR = {
  '창':'창세기','출':'출애굽기','레':'레위기','민':'민수기','신':'신명기',
  '수':'여호수아','삿':'사사기','룻':'룻기','삼상':'사무엘상','삼하':'사무엘하',
  '왕상':'열왕기상','왕하':'열왕기하','대상':'역대상','대하':'역대하',
  '스':'에스라','느':'느헤미야','에':'에스더','욥':'욥기','시':'시편',
  '잠':'잠언','전':'전도서','아':'아가','사':'이사야','렘':'예레미야',
  '애':'예레미야애가','겔':'에스겔','단':'다니엘','호':'호세아','욜':'요엘',
  '암':'아모스','옵':'오바댜','욘':'요나','미':'미가','나':'나훔',
  '합':'하박국','습':'스바냐','학':'학개','슥':'스가랴','말':'말라기',
  '마':'마태복음','막':'마가복음','눅':'누가복음','요':'요한복음','행':'사도행전',
  '롬':'로마서','고전':'고린도전서','고후':'고린도후서','갈':'갈라디아서',
  '엡':'에베소서','빌':'빌립보서','골':'골로새서','살전':'데살로니가전서','살후':'데살로니가후서',
  '딤전':'디모데전서','딤후':'디모데후서','딛':'디도서','몬':'빌레몬서',

// 전체 책이름 → 약자 (노트에 [요3:16] 같은 짧은 참조를 표시할 때 사용)
const FULL_TO_ABBR = {};
for(const abbr in BOOK_ABBR){
  const full = BOOK_ABBR[abbr];
  if(!(full in FULL_TO_ABBR) || abbr.length < FULL_TO_ABBR[full].length){
    FULL_TO_ABBR[full] = abbr;
  }
}

function parseBibleRef(q){
  q = q.trim().replace('：',':').replace(/[~∼–]/g,'-');
  const m = q.match(/^([가-힣]+)\s*(\d+)\s*[:장]\s*(\d+)(?:\s*-\s*(\d+))?/);
  if(!m) return null;
  let book = m[1];
  if(BOOK_ABBR[book]) book = BOOK_ABBR[book];
  return {
    book,
    chapter: m[2],
    verseStart: parseInt(m[3]),
    verseEnd: m[4] ? parseInt(m[4]) : parseInt(m[3])
  };
}

function buildVerseLinesHTML(verseObjs){
  return verseObjs.map(v=>`<div class="verse-line"><span class="verse-num">${escapeHtml(v.num)}</span><span class="verse-body">${escapeHtml(v.text)}</span></div>`).join('');
}

function bibleSearchForEdit(){
  const query = document.getElementById('edit-bible-query').value.trim();
  if(!query){ showToast('검색어를 입력해주세요'); return; }
  if(!window.BIBLE_DATA){ showToast('성경 데이터 로딩 중... 잠시 후 다시 시도해주세요'); return; }

  const version = document.getElementById('edit-bible-version').value;
  const books = window.BIBLE_DATA.books;
  const vData = window.BIBLE_DATA[version];
  const refEl = document.getElementById('edit-scripture-ref');
  const textEl = document.getElementById('edit-scripture-text');

  try{
    const parsed = parseBibleRef(query);
    if(parsed){
      const bookIdx = books.indexOf(parsed.book);
      if(bookIdx < 0) throw new Error('책 이름을 찾을 수 없어요');
      const bookNo = String(bookIdx + 1);
      const chap = vData[bookNo] && vData[bookNo][parsed.chapter];
      if(!chap) throw new Error('해당 장을 찾을 수 없어요');
      let verseObjs = [];
      for(let v = parsed.verseStart; v <= parsed.verseEnd; v++){
        if(chap[String(v)]) verseObjs.push({num:String(v), text:chap[String(v)]});
      }
      if(!verseObjs.length) throw new Error('해당 절을 찾을 수 없어요');
      if(!refEl.value) refEl.value = query;
      textEl.innerHTML = textEl.innerHTML ? textEl.innerHTML + buildVerseLinesHTML(verseObjs) : buildVerseLinesHTML(verseObjs);
      showToast('✓ 본문이 추가됐어요');
    } else {
      const objs = [];
      outer:
      for(const bookNo in vData){
        const bookName = books[parseInt(bookNo)-1];
        for(const chap in vData[bookNo]){
          for(const v in vData[bookNo][chap]){
            const t = vData[bookNo][chap][v];
            if(t.includes(query)){
              objs.push({num:`${bookName} ${chap}:${v}`, text:t});
              if(objs.length >= 30) break outer;
            }
          }
        }
      }
      if(!objs.length) throw new Error('검색 결과가 없어요');
      textEl.innerHTML = textEl.innerHTML ? textEl.innerHTML + buildVerseLinesHTML(objs) : buildVerseLinesHTML(objs);
      showToast(`✓ 검색 결과 ${objs.length}건이 추가됐어요`);
    }
    document.getElementById('edit-bible-query').value = '';
  }catch(e){
    showToast('⚠️ ' + e.message);
  }
}
</script>
